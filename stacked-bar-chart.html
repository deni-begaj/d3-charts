<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Stacked Bar Chart with D3.js</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
      /* Define your CSS styles here */
    </style>
  </head>
  <body>
    <div id="chart-container"></div>

    <script>
      // Define your data
      const data = [
        { category: 'Category 1', values: [20, 30, 40] },
        { category: 'Category 2', values: [50, 10, 25] },
        { category: 'Category 3', values: [15, 35, 45] },
      ];

      // Set up the chart dimensions
      const width = 1200;
      const height = 400;
      const margin = { top: 20, right: 30, bottom: 30, left: 40 };

      // Create an SVG element
      const svg = d3.select("#chart-container")
        .append("svg")
        .attr("width", width)
        .attr("height", height);

      // Create a group element for the chart
      const chart = svg.append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      // Define x and y scales with increased padding
      const xScale = d3.scaleBand()
        .domain(data.map(d => d.category))
        .range([0, width - margin.left - margin.right])
        .padding(0.6); // Increase the padding to 0.2 for more space

      const yScale = d3.scaleLinear()
        .domain([0, d3.max(data, d => d3.sum(d.values))])
        .nice()
        .range([height - margin.top - margin.bottom, 0]);

      // Create color scale
      const color = d3.scaleOrdinal()
        .domain(data[0].values.map((_, i) => i))
        .range(d3.schemeCategory10);

      // Create and append bars
      chart.selectAll(".bar")
        .data(data)
        .enter()
        .append("g")
        .attr("class", "bar")
        .attr("transform", d => `translate(${xScale(d.category)},0)`)
        .selectAll("rect")
        .data(d => d.values)
        .enter()
        .append("rect")
        .attr("x", (d, i) => xScale.bandwidth() / data[0].values.length * i)
        .attr("y", d => yScale(d))
        .attr("width", xScale.bandwidth() - 1)
        .attr("height", d => yScale(0) - yScale(d))
        .attr("fill", (d, i) => color(i));

      // Add axes
      chart.append("g")
        .attr("class", "x-axis")
        .attr("transform", `translate(0,${height - margin.top - margin.bottom})`)
        .call(d3.axisBottom(xScale));

      chart.append("g")
        .attr("class", "y-axis")
        .call(d3.axisLeft(yScale).ticks(5));

    </script>
  </body>
</html>
